name: Sprint 1 toolchain
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upstream:
        description: Build the pinned Micro Blossom parser and test hardware graph export
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - run: rustc --version --verbose && cargo --version
      - run: python -m pip install -r requirements-dev.txt
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: python -m unittest discover -s tests -v
        env:
          RUN_RUST_TESTS: '1'
      - run: cargo install --locked --path . --root artifacts/install
      - name: Smoke-test installed binary outside checkout
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/artifacts/install/bin/microblossom-toolchain" compile \
            "$GITHUB_WORKSPACE/examples/tiny.stim" --output "$RUNNER_TEMP/tiny"

  cpu:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D non_local_definitions -D static_mut_refs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Build CPU decoder on stable (including embedded benchmark mains)
        # Run from the repo root so the nested nightly toolchain file does not override stable.
        run: cargo build --release --locked --manifest-path src/cpu/blossom/Cargo.toml --bin micro_blossom
      - name: Verify standalone CPU lockfiles
        run: |
          cargo metadata --locked --no-deps --format-version 1 --manifest-path src/cpu/blossom-nostd/Cargo.toml > /dev/null
          cargo metadata --locked --no-deps --format-version 1 --manifest-path src/cpu/embedded/Cargo.toml > /dev/null
      - name: Test parallel-window decoder
        run: cargo test --release --locked --manifest-path src/cpu/blossom/Cargo.toml --lib parallel_window -- --nocapture

  upstream:
    if: github.event_name == 'workflow_dispatch' && inputs.upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shsym/micro-blossom
          ref: 3dd1817eecdb4bf9899433108d9a2edccf198c8e
          path: artifacts/micro-blossom
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: rustc --version --verbose && cargo --version
      - run: python -m pip install -r requirements-dev.txt
      - name: Build upstream CPU parser
        run: cargo build --release --locked --manifest-path artifacts/micro-blossom/src/cpu/blossom/Cargo.toml --bin micro_blossom
      - name: Run pipeline including upstream hardware parser
        run: python -m unittest discover -s tests -v
        env:
          RUN_RUST_TESTS: '1'
          MICROBLOSSOM_BINARY: ${{ github.workspace }}/artifacts/micro-blossom/src/cpu/blossom/target/release/micro_blossom
